name: Build SlipKiosk exe (loader)

on:
  workflow_dispatch:      # Actions tab -> "Run workflow"
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name SlipKiosk
          --hidden-import zk --hidden-import win32print
          --hidden-import win32ui --hidden-import win32con
          --hidden-import openpyxl
          loader.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SlipKiosk
          path: dist/SlipKiosk.exe
